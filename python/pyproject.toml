[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myocr-client"
version = "0.3.0"
description = "Official Python SDK for myocr.app — convert PDFs and images to structured Excel using myocr's OCR engine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "MAD.AI SRL", email = "info@myocr.app" },
]
keywords = ["ocr", "pdf", "excel", "bank-statement", "invoice", "document-extraction", "myocr", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://www.myocr.app"
Documentation = "https://www.myocr.app/docs/api"
Repository = "https://github.com/Selaf688/myocr-sdk"
Source = "https://github.com/Selaf688/myocr-sdk/tree/main/python"
Examples = "https://github.com/Selaf688/myocr-sdk/tree/main/examples"
"Bug Tracker" = "https://github.com/Selaf688/myocr-sdk/issues"
Changelog = "https://github.com/Selaf688/myocr-sdk/blob/main/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["myocr_client"]

[tool.hatch.build.targets.sdist]
include = [
    "myocr_client",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
